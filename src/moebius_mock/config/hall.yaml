      "#                                               #",
      "#                                               #",
      "#################################################"
    ]
    # Трасса: массив точек линии на полу [x1, y1, x2, y2, x3, y3...]
    line_points: [1.5, 1.5, 2.5, 1.5, 2.5, 2.5, 4.0, 3.5]

    # Метки: [x, y, индекс_разворота(0,1,2,3), id_маркера, ...]
    aruco_markers: [
      2.50, 3.50, 3.0, 42.0,
      3.50, 2.50, 2.0, 15.0
    ]



    # Геометрия позиций знаков: [x_куба, y_куба, индекс_грани(0,1,2,3)]
    # Первый знак на кубе (3, 2) смотрит назад (3). Второй знак на кубе (5, 4) смотрит вправо (0).
    road_signs_poses: [
      3.0, 2.0, 2.0,
      5.0, 4.0, 0.0
    ]
    
    # Имена файлов картинок дорожных знаков из папки textures/
    # Первая строка пойдет первому знаку, вторая — второму и так далее.
    road_signs_files: [
      "red.png",
      "green.png"
    ]

    # Геометрия препятствий
    sign_width: 0.3
    sign_height: 0.3
    aruco_width: 0.4
    aruco_height: 0.4
