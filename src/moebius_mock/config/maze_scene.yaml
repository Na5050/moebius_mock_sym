mock_moebius_maze:
  ros__parameters:
    # Начальная позиция робота Moebius в лабиринте (в метрах)
    initial_pose: [1.5, 1.8, 0.0]  # [x, y, theta]

    # Текстовая карта обстановки (массив строк)
    # Вы можете перерисовывать её как угодно, главное чтобы все строки были одной длины
    maze_map: [
      "###S########",
      "#     #    #",
      "# ### # ## #",
      "# #      # #",
      "# # ###### #",
      "#          #",
      "###### #####",
      "#        # #",
      "# ###### # #",
      "# #    #   #",
      "R   ##   # #",
      "###L########"
    ]
